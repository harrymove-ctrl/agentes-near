name: Bug report
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - agentes.chat Cloud
        - Self-hosted
        - Not applicable
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Self-hosted image tag (or `version` from `/api/health`), or the phone or desktop app version.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste logs or error messages (`docker compose logs agentes`). Redact keys, tokens and personal data.
      render: shell
