<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Acme · Dashboard</title>
<style>
body{font-family:-apple-system,Helvetica,sans-serif;margin:0;color:#222}
header{padding:12px 16px;border-bottom:1px solid #ddd;position:relative}
nav a{margin-right:14px}
#gear{position:absolute;right:16px;top:6px;width:38px;height:38px;border:1px solid #ccc;border-radius:8px;background:#fff;padding:7px}
main{max-width:720px;margin:28px auto;padding:0 16px}
table{border-collapse:collapse;width:100%;margin:12px 0 20px}
td,th{border-bottom:1px solid #eee;padding:8px;text-align:left}
</style></head>
<body>
<header>
  <nav><a href="/dashboard.html">Acme</a> <a href="/orders.html">Orders</a> <a href="/dashboard.html">Invoices</a></nav>
  <button id="gear"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#333" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main>
  <h1>Dashboard</h1>
  <p>Welcome back, Ana.</p>
  <table>
    <caption>Invoices</caption>
    <thead><tr><th>Invoice</th><th>Amount</th><th>Actions</th></tr></thead>
    <tbody>
      <tr><td>Invoice 41</td><td>R$ 120,00</td><td><button>Edit</button> <button>Delete</button></td></tr>
      <tr><td>Invoice 42</td><td>R$ 42,00</td><td><button>Edit</button> <button>Delete</button></td></tr>
      <tr><td>Invoice 43</td><td>R$ 310,00</td><td><button>Edit</button> <button>Delete</button></td></tr>
    </tbody>
  </table>
  <button id="export">Export</button> <span id="status" role="status"></span>
</main>
<script>
document.getElementById("export").onclick = () => {
  const s = document.getElementById("status");
  s.textContent = "Preparing the export…";
  setTimeout(() => { s.textContent = "Export ready: invoices.csv"; }, 2500);
};
document.getElementById("gear").onclick = () => { location.href = "/settings.html"; };
</script>
</body></html>
